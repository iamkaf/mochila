name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: iamkaf/multiloader-conventions/.github/workflows/mod-build.yml@e808aac57fd30afcfc3e7b517f88b3143fd3211d

  teakit:
    name: TeaKit 26.2 Fabric
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: iamkaf/setup-teakit@5a028d45f75cddf03a60dcad1682a93c66303286 # v1.0.0

      - name: Check TeaKit configuration and tests
        run: >-
          ./gradlew teakitDoctor teakitTypecheck
          -Pmultiloader.target.versions=26.2
          -Pmultiloader.target.loaders=fabric
          --console=plain --max-workers=2

      - name: Run backpack tests in Minecraft
        run: >-
          ./gradlew teakitCheck
          -Pteakit.node=26.2-fabric
          -Pteakit.background=true
          -Pteakit.failOnRuntimeIncomplete=true
          -Pteakit.report=build/teakit/ci-summary.json
          -Pmultiloader.target.versions=26.2
          -Pmultiloader.target.loaders=fabric
          --console=plain --max-workers=2

      - name: Remove runtime credentials from the summary
        if: always()
        id: report
        shell: python
        run: |
          import json
          from pathlib import Path

          def redact(value):
              if isinstance(value, dict):
                  return {key: redact(item) for key, item in value.items() if key != "token"}
              if isinstance(value, list):
                  return [redact(item) for item in value]
              return value

          report = Path("build/teakit/ci-summary.json")
          if report.exists():
              report.write_text(json.dumps(redact(json.loads(report.read_text())), indent=2) + "\n")

      - name: Upload TeaKit results and screenshots
        if: always() && steps.report.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: teakit-26.2-fabric
          retention-days: 7
          path: |
            build/teakit/ci-summary.json
            fabric/versions/26.2/runs/client/screenshots/
            fabric/versions/26.2/runs/client/logs/
            fabric/versions/26.2/runs/client/crash-reports/
          if-no-files-found: warn
